# Canonical Founder Panel query proxy for Stu / Steward Navigator.
# The browser already authenticates at the console server block; this route
# must proxy directly to the read/query service, never back into preview nginx.
location = /founder-ui-preview/api/steward-navigator/query {
    auth_basic "ICAM Founder Panel";
    auth_basic_user_file /etc/nginx/.htpasswd-icam-founder;
    limit_except POST { deny all; }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store, private" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_pass http://127.0.0.1:8833/api/steward-navigator/query;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}
